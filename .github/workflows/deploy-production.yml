name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # النشر عبر SSH إلى خادم خاص (VPS: /opt/asas/app + Docker) — يتطلب أسرار SERVER_HOST / SERVER_USER /
      # SERVER_SSH_KEY / SERVER_KNOWN_HOSTS. بدونها تُتخطّى الخطوات بدل الفشل (الموقع الحالي على Render ينشر نفسه من GitHub).
      - name: Check server secrets
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deploy skipped - SERVER_HOST / SERVER_USER / SERVER_SSH_KEY secrets are not set (Render deploys the site on its own)."
          fi

      - name: Check out source
        if: steps.server.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Configure SSH
        if: steps.server.outputs.configured == 'true'
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release files
        if: steps.server.outputs.configured == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" 'mkdir -p /opt/asas/app'
          rsync -az --delete \
            --exclude='.env.production' \
            --exclude='uploads/' \
            --exclude='backups/' \
            --exclude='.git/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/deploy_key' \
            ./ "$SERVER_USER@$SERVER_HOST:/opt/asas/app/"

      - name: Build and restart production
        if: steps.server.outputs.configured == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
            set -eu
            cd /opt/asas/app
            test -f .env.production
            docker compose --env-file .env.production -f compose.production.yml up -d --build --remove-orphans
            docker image prune -f
          REMOTE
