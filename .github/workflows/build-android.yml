name: Build Android APK

# تطبيق أندرويد لـ NoonERP System (android-app/): غلاف Capacitor يفتح النظام من الخادم.
# الناتج: NoonERP-System-debug.apk (يُثبَّت مباشرة على الجوال)، و NoonERP-System-release.apk
# الموقَّع إن وُجدت أسرار التوقيع (ANDROID_KEYSTORE_BASE64 ...). يُنزَّل من صفحة التشغيل ← Artifacts.
# عنوان الخادم: متغير المستودع ANDROID_SERVER_URL أو قيمة الإدخال اليدوي، وإلا capacitor.config.json.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "عنوان الخادم (https) — اتركه فارغاً لاستخدام الافتراضي"
        required: false
        default: ""
  push:
    paths:
      - "android-app/**"
      - "public/icon-512.jpg"
      - ".github/workflows/build-android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # صورة 24.04 تحوي Android SDK مثبتاً (ubuntu-latest ينتقل إلى 26 وقد لا يحويه)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    env:
      SERVER_URL: ${{ github.event.inputs.server_url || vars.ANDROID_SERVER_URL }}
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # SDK المثبت مسبقاً على الصورة؛ قبول التراخيص وتنزيل منصة 34 وأدوات البناء التي يحتاجها Capacitor 6
      - name: Prepare Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          manager="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: |
          npm run configure
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: App icons from public/icon-512.jpg
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null
          res=android/app/src/main/res
          # أيقونات PNG تقليدية بدل الأيقونة التكيّفية الافتراضية لـ Capacitor
          rm -rf "$res/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${pair%%:*}; size=${pair##*:}
            mkdir -p "$res/mipmap-$density"
            convert ../public/icon-512.jpg -resize ${size}x${size}! "$res/mipmap-$density/ic_launcher.png"
            cp "$res/mipmap-$density/ic_launcher.png" "$res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NoonERP-System-debug.apk"

      # خطوتان منفصلتان ليظهر موضع أي فشل من اسم الخطوة نفسها
      - name: Build release APK (when signing secrets exist)
        id: release
        working-directory: android-app/android
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "No signing secrets — skipping release APK"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          ./gradlew assembleRelease --no-daemon
          ls -l app/build/outputs/apk/release/
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Sign release APK
        if: steps.release.outputs.build == 'true'
        working-directory: android-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # السر قد يُلصق بأسطر/مسافات زائدة — تُزال قبل فك base64
          cleaned="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "ANDROID_KEYSTORE_BASE64 length: ${#cleaned} (expected about 3568 for noonerp-release.p12)"
          if ! printf '%s' "$cleaned" | base64 -d > "$RUNNER_TEMP/release.keystore" 2> "$RUNNER_TEMP/b64.err"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (length ${#cleaned}) - paste the ENTIRE contents of noonerp-release.p12.base64.txt"; cat "$RUNNER_TEMP/b64.err"; exit 1
          fi
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/release.keystore")"
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One of ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD is empty"; exit 1
          fi
          # المفتاح PKCS12 (.p12) أو JKS — يُكتشف النوع من أول 4 بايت
          ks_type=PKCS12
          magic="$(head -c 4 "$RUNNER_TEMP/release.keystore" | od -An -tx1 | tr -d '[:space:]')"
          if [ "$magic" = "feedfeed" ]; then ks_type=JKS; fi
          echo "keystore type: $ks_type"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storetype "$ks_type" -storepass "$KEYSTORE_PASSWORD" > /dev/null; then
            echo "::error::Cannot open signing keystore - check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD"; exit 1
          fi
          unsigned="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          if ! "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-type "$ks_type" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$GITHUB_WORKSPACE/NoonERP-System-release.apk" "$unsigned"; then
            echo "::error::APK signing failed - check ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD"; exit 1
          fi
          "$apksigner" verify --print-certs "$GITHUB_WORKSPACE/NoonERP-System-release.apk" > "$RUNNER_TEMP/verify.txt"
          cat "$RUNNER_TEMP/verify.txt"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoonERP-System-android-${{ github.run_number }}
          path: |
            NoonERP-System-debug.apk
            NoonERP-System-release.apk
          if-no-files-found: error

      # رابط ثابت لآخر نسخة: releases/download/android-latest/NoonERP-System.apk
      # (ضعه في ANDROID_APK_URL على الخادم ليظهر زر "تطبيق أندرويد" في الشاشة الرئيسية — المستودع يجب أن يكون عاماً،
      # وإلا انسخ الملف إلى public/downloads/NoonERP-System.apk على الخادم)
      - name: Publish to release "android-latest"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=NoonERP-System-release.apk
          [ -f "$apk" ] || apk=NoonERP-System-debug.apk
          cp "$apk" NoonERP-System.apk
          if ! gh release view android-latest > /dev/null 2>&1; then
            gh release create android-latest --title "NoonERP System — Android" --notes "آخر نسخة من تطبيق أندرويد (تُحدَّث تلقائياً مع كل بناء)" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload android-latest NoonERP-System.apk --clobber
          gh release edit android-latest --notes "آخر نسخة من تطبيق أندرويد — الإصدار 1.0.${{ github.run_number }} ($(date -u +%Y-%m-%d))"
