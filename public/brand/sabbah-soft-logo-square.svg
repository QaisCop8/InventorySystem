<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <!-- شعار شركة الصبّاح للبرمجة بصيغة مربعة: الصاد بألوانه الأصلية فوق الاسم -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="stackShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#047857" flood-opacity=".30"/></filter>
    <linearGradient id="softText" gradientUnits="userSpaceOnUse" x1="1010" y1="0" x2="1320" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>
  <rect width="1600" height="1600" fill="#ffffff"/>
  <circle cx="260" cy="240" r="420" fill="#10b981" opacity=".07" filter="url(#blur)"/>
  <circle cx="1360" cy="1380" r="460" fill="#06b6d4" opacity=".07" filter="url(#blur)"/>
  <g transform="translate(511 207) scale(1.3)"><g filter="url(#stackShadow)">
    <path d="M 96 170 L 96 230 A 92 92 0 0 0 280 230" fill="none" stroke="#10b981" stroke-width="54" stroke-linecap="round" opacity=".9"/>
    <rect x="226" y="150" width="128" height="104" rx="52" fill="none" stroke="#06b6d4" stroke-width="44" opacity=".82"/>
    <path d="M 160 78 Q 166 114 188 108 Q 202 104 206 78 Q 210 110 230 108 Q 246 106 250 78 Q 256 112 274 100" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="960" font-size="220" font-weight="700" fill="#0f172a" letter-spacing="-6">sabbah<tspan dx="28" font-weight="300" fill="url(#softText)">soft</tspan></text>
    <text x="800" y="1112" font-size="100" font-weight="700" fill="#047857" direction="rtl">شركة الصبّاح للبرمجة</text>
    <text x="800" y="1202" font-size="40" font-weight="600" fill="#64748b" letter-spacing="14">SOFTWARE SOLUTIONS</text>
  </g>
</svg>
